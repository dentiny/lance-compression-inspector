[workspace]
members = [
    "crates/lance-compression-estimation",
    "crates/lance-compression-cli",
]
default-members = ["crates/lance-compression-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dentiny/lance-compression-inspector"

[workspace.dependencies]
lance-compression-estimation = { path = "crates/lance-compression-estimation" }

anyhow = "1"
arrow-array = "58"
arrow-schema = "58"
clap = { version = "4", features = ["derive"] }
lance = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118", default-features = false }
lance-core = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118" }
lance-encoding = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118" }
lance-file = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118" }
lance-io = { git = "https://github.com/lance-format/lance.git", rev = "b94b20c785caadc3c95239af0108eaed8b35a118", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
async-trait = "0.1"
object_store = "0.14"
object_store_opendal = "0.60.2"
opendal = { version = "0.59.3", default-features = false, features = ["services-s3", "http-transport-reqwest", "executors-tokio"] }
url = "2"

[workspace]
members = [
    "crates/lance-compression-estimation",
    "crates/lance-compression-cli",
]
default-members = ["crates/lance-compression-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dentiny/lance-compression-inspector"

[workspace.dependencies]
lance-compression-estimation = { path = "crates/lance-compression-estimation" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
lance = { version = "=12.0.0", default-features = false }
lance-core = "=12.0.0"
lance-encoding = "=12.0.0"
lance-file = "=12.0.0"
lance-io = { version = "=12.0.0", default-features = false }
object_store = "0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
